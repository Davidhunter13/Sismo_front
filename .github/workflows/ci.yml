# Nota de Transparencia: Código generado/refactorizado con asistencia de IA Generativa (Claude Code) bajo la Política ODTI012 del CCS. Requiere supervisión y validación humana permanente.
# Integración continua: en cada push o pull request a main se verifican calidad y pruebas,
# y se genera el APK de depuración como artefacto descargable.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint, tipos y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Reporte de Playwright si fallan las pruebas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-resultados
          path: test-results/
          retention-days: 7

  android:
    name: APK de Android (debug)
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: sismo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
